                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'rhombus', x: 50 - editorView.x, y: 50 - editorView.y, label: '判断' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="判断 (Rhombus)"><Icon path={Icons.Rhombus} /></button>
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'hexagon', x: 50 - editorView.x, y: 50 - editorView.y, label: '准备' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="准备 (Hexagon)"><Icon path={Icons.Hexagon} /></button>
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'parallelogram', x: 50 - editorView.x, y: 50 - editorView.y, label: '输入/输出' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="输入/输出 (Parallelogram)"><Icon path={Icons.Parallelogram} /></button>
                            </div>
                            <div className="h-6 w-px bg-gray-300 mx-2 shrink-0"></div>
                            <div className="flex bg-gray-100 rounded p-1 shrink-0">
                                <button onClick={() => setMode('select')} className={`flex items-center space-x-1 px-3 py-1.5 rounded text-sm ${mode === 'select' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}><Icon path={Icons.MousePointer2} size={16} /><span>选择</span></button>
                                <button onClick={() => setMode('link')} className={`flex items-center space-x-1 px-3 py-1.5 rounded text-sm ${mode === 'link' ? 'bg-white shadow text-blue-600' : 'text-gray-500'}`}><Icon path={Icons.ArrowRight} size={16} /><span>连线</span></button>
                            </div>
                        </div>
                        <div className="flex items-center space-x-2 shrink-0">
                            <button onClick={manualLayoutTrigger} className="flex items-center space-x-1 px-3 py-1.5 rounded hover:bg-gray-100 text-blue-600 font-medium" title="自动排版"><Icon path={Icons.Magic} size={16} /><span>排版</span></button>
                            <div className="h-6 w-px bg-gray-300 mx-1"></div>
                            <button onClick={undo} disabled={!canUndo} className="p-2 text-gray-600 hover:bg-gray-100 rounded disabled:opacity-30 disabled:cursor-not-allowed" title="撤销 (Cmd+Z)"><Icon path={Icons.ArrowBack} size={16} /></button>
                            <button onClick={redo} disabled={!canRedo} className="p-2 text-gray-600 hover:bg-gray-100 rounded disabled:opacity-30 disabled:cursor-not-allowed" title="重做 (Cmd+Shift+Z)"><Icon path={Icons.ArrowForward} size={16} /></button>
                            <div className="h-6 w-px bg-gray-300 mx-1"></div>
                            <button onClick={toggleDirection} className="flex items-center space-x-1 px-3 py-1.5 rounded hover:bg-gray-100 text-gray-700"><RotateIcon size={16} /><span>{direction === 'TD' ? '纵向' : '横向'}</span></button>
                            <div className="h-6 w-px bg-gray-300 mx-1"></div>
                            <button onClick={() => setSnapToGrid(!snapToGrid)} className={`p-2 rounded ${snapToGrid ? 'bg-blue-100 text-blue-600' : 'text-gray-600 hover:bg-gray-100'}`} title="网格对齐"><Icon path={Icons.Layout} size={16} /></button>
                            <button onClick={deleteSelection} disabled={!selection && multiSelect.size === 0} className="p-2 text-red-600 hover:bg-red-50 rounded disabled:opacity-50" title="删除 (Delete)"><Icon path={Icons.Trash2} /></button>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        <div className="flex-1 relative overflow-hidden grid-bg cursor-grab active:cursor-grabbing" ref={containerRef} style={{ backgroundPosition: `${editorView.x}px ${editorView.y}px`, backgroundSize: `${20 * editorView.scale}px ${20 * editorView.scale}px` }} onWheel={(e) => handleWheel(e, editorView, setEditorView)} onPointerDown={(e) => handlePointerDown(e, 'canvas')} onPointerMove={handlePointerMove} onPointerUp={handleCanvasPointerUp}>
                            <div style={{ transform: `translate(${editorView.x}px, ${editorView.y}px) scale(${editorView.scale})`, transformOrigin: '0 0', width: '100%', height: '100%' }}>
                                {renderLinkInput()}
                                <svg className="absolute top-0 left-0 w-[50000px] h-[50000px] pointer-events-none z-0" style={{ overflow: 'visible', transform: 'translate(-25000px, -25000px)' }}>
                                    <defs>
                                        <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b" /></marker>
                                        <marker id="arrowhead-blue" markerWidth="12" markerHeight="12" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" /></marker>
                                        <marker id="arrowhead-rev" markerWidth="12" markerHeight="12" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="10 0, 0 3.5, 10 7" fill="#64748b" /></marker>
                                        <marker id="arrowhead-rev-blue" markerWidth="12" markerHeight="12" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth"><polygon points="10 0, 0 3.5, 10 7" fill="#3b82f6" /></marker>
                                    </defs>
                                    <g transform="translate(25000, 25000)">
                                        {links.map(link => {
                                            const visuals = getLinkVisuals(link);
                                            const path = visuals.path;
                                            const midX = visuals.midX;
                                            const midY = visuals.midY;

                                            const isSel = selection?.type === 'link' && selection.id === link.id;
                                            const color = isSel ? '#2563eb' : '#64748b';
                                            const mStart = (link.arrow === 'back' || link.arrow === 'both') ? (isSel ? 'url(#arrowhead-rev-blue)' : 'url(#arrowhead-rev)') : '';
                                            const mEnd = (link.arrow === 'forward' || link.arrow === 'both' || !link.arrow) ? (isSel ? 'url(#arrowhead-blue)' : 'url(#arrowhead)') : '';

                                            if (!path) return null;

                                            return (
                                                <g key={link.id}>
                                                    <path d={path} stroke="transparent" strokeWidth={15} fill="none" className="pointer-events-auto cursor-pointer" onClick={(e) => { e.stopPropagation(); setSelection({ type: 'link', id: link.id }) }} onDoubleClick={(e) => { e.stopPropagation(); handleLinkDoubleClick(link.id, link.label) }} />
                                                    <path d={path} stroke={color} strokeWidth={isSel ? 3 : 2} fill="none" markerStart={mStart} markerEnd={mEnd} strokeDasharray={link.type === 'dotted' ? '6,4' : '0'} />
                                                    {link.label && editingLinkId !== link.id && <text x={midX} y={midY} textAnchor="middle" fill="#475569" fontSize="12" dy="-5" className="bg-white px-1 pointer-events-auto cursor-pointer select-none" onClick={(e) => { e.stopPropagation(); setSelection({ type: 'link', id: link.id }) }} onDoubleClick={(e) => { e.stopPropagation(); handleLinkDoubleClick(link.id, link.label) }}>{link.label}</text>}
                                                </g>
                                            )
                                        })}
                                        {drawingLink && <line x1={drawingLink.startX} y1={drawingLink.startY} x2={drawingLink.currX} y2={drawingLink.currY} stroke="#3b82f6" strokeWidth="2" strokeDasharray="5,5" markerEnd="url(#arrowhead-blue)" />}
                                    </g>
                                </svg>
                                {nodes.map(node => {
                                    // 获取节点尺寸，包括自定义尺寸
                                    const { width, height } = getNodeSize(node.type, node.label, node.customWidth, node.customHeight);
                                    const isSel = selection?.type === 'node' && selection.id === node.id;
                                    const isMultiSel = multiSelect.has(node.id);
                                    const isEdit = editingNodeId === node.id;
                                    const isHovered = hoveredNodeId === node.id;
                                    return (
                                        <div key={node.id}
                                            style={{ position: 'absolute', left: node.x, top: node.y, width, height, zIndex: isSel || isEdit || isMultiSel ? 30 : 10 }}
                                            className={`cursor-${mode === 'select' ? 'move' : 'crosshair'} pointer-events-auto ${isMultiSel ? 'ring-2 ring-blue-300 ring-opacity-50' : ''}`}
                                            onPointerDown={(e) => handlePointerDown(e, 'node', node.id)}
                                            onPointerUp={(e) => handleNodePointerUp(e, node.id)}
                                            onMouseEnter={() => setHoveredNodeId(node.id)}
                                            onMouseLeave={() => setHoveredNodeId(null)}
                                        >
                                            <NodeVisual node={node} isSel={isSel || isMultiSel} isEdit={isEdit} tempLabel={tempLabel} setTempLabel={setTempLabel} finishEditing={finishEditing} inputRef={inputRef} onResizeStart={handleResizeStart} showResizeHandles={isHovered || isSel || isMultiSel} />
                                        </div>
                                    )
                                })}
                                {/* 框选可视化 */}
                                {boxSelect && (
                                    <div
                                        style={{
                                            position: 'absolute',
                                            left: Math.min(boxSelect.startX, boxSelect.endX),
                                            top: Math.min(boxSelect.startY, boxSelect.endY),
                                            width: Math.abs(boxSelect.endX - boxSelect.startX),
                                            height: Math.abs(boxSelect.endY - boxSelect.startY),
                                            border: '2px dashed #3b82f6',
                                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                            pointerEvents: 'none',
                                            zIndex: 25
                                        }}
                                    />
                                )}
                            </div>
                            <div className="absolute bottom-4 left-4 flex space-x-2 bg-white p-1 rounded-md shadow border border-gray-200 z-30"><div className="px-2 py-1 text-xs text-gray-500 font-mono border-r border-gray-100 flex items-center">{(editorView.scale * 100).toFixed(0)}%</div><button onClick={() => setEditorView({ x: 0, y: 0, scale: 1 })} className="p-1 hover:bg-gray-100 rounded text-gray-600"><Icon path={Icons.Reset} size={14} /></button></div>
                        </div>

                        <div className="w-80 bg-white border-l border-gray-200 flex flex-col shadow-lg z-30 relative">
                            <div className="p-4 border-b border-gray-100 bg-gray-50 flex-shrink-0">
                                <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                                    {multiSelect.size > 0 ? `已选择 ${multiSelect.size} 个节点` : selection ? (selection.type === 'node' ? '节点属性' : '连线属性') : '未选中'}
                                </h3>
                                {multiSelect.size > 0 ? (
                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-xs text-gray-500 mb-2">对齐工具</label>
                                            <div className="grid grid-cols-3 gap-1">
                                                <button onClick={() => alignNodes('left')} className="p-2 text-xs border border-gray-200 rounded hover:bg-blue-50 hover:border-blue-300" title="左对齐">左</button>
                                                <button onClick={() => alignNodes('center')} className="p-2 text-xs border border-gray-200 rounded hover:bg-blue-50 hover:border-blue-300" title="水平居中">中</button>
                                                <button onClick={() => alignNodes('right')} className="p-2 text-xs border border-gray-200 rounded hover:bg-blue-50 hover:border-blue-300" title="右对齐">右</button>
                                                <button onClick={() => alignNodes('top')} className="p-2 text-xs border border-gray-200 rounded hover:bg-blue-50 hover:border-blue-300" title="顶部对齐">顶</button>
                                                <button onClick={() => alignNodes('middle')} className="p-2 text-xs border border-gray-200 rounded hover:bg-blue-50 hover:border-blue-300" title="垂直居中">中</button>
                                                <button onClick={() => alignNodes('bottom')} className="p-2 text-xs border border-gray-200 rounded hover:bg-blue-50 hover:border-blue-300" title="底部对齐">底</button>
                                            </div>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <label className="text-xs text-gray-500">网格对齐</label>
                                            <input type="checkbox" checked={snapToGrid} onChange={(e) => setSnapToGrid(e.target.checked)} className="w-4 h-4" />
                                        </div>
                                    </div>
                                ) : selection ? (
                                    <div className="space-y-3">
                                        <div><label className="block text-xs text-gray-500 mb-1">文本内容</label><input type="text" value={selection.type === 'node' ? nodes.find(n => n.id === selection.id)?.label || '' : links.find(l => l.id === selection.id)?.label || ''} onChange={e => updateLabel(e.target.value)} className="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:border-blue-500 focus:outline-none" /></div>
                                        {selection.type === 'link' && (
                                            <>
                                                <div>
                                                    <label className="block text-xs text-gray-500 mb-1">线条样式</label>
                                                    <div className="flex space-x-1">
                                                        {['solid', 'dotted'].map(t => {
                                                            const l = links.find(lnk => lnk.id === selection.id);
                                                            return <button key={t} onClick={() => toggleLinkType()} className={`flex-1 p-1.5 rounded border text-xs flex justify-center ${l?.type === t ? 'bg-blue-50 border-blue-300 text-blue-600' : 'bg-white border-gray-200'}`}><Icon path={t === 'solid' ? Icons.LineSolid : Icons.LineDotted} /></button>
                                                        })}
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-gray-500 mb-1">箭头方向</label>
                                                    <div className="flex space-x-1">
                                                        {[
                                                            { k: 'none', i: Icons.ArrowNone }, { k: 'forward', i: Icons.ArrowForward },
                                                            { k: 'back', i: Icons.ArrowBack }, { k: 'both', i: Icons.ArrowBoth }
                                                        ].map(opt => {
                                                            const l = links.find(lnk => lnk.id === selection.id);
                                                            const active = (l?.arrow || 'forward') === opt.k;
                                                            return <button key={opt.k} onClick={() => setLinkArrow(opt.k)} className={`flex-1 p-1.5 rounded border text-xs flex justify-center ${active ? 'bg-blue-50 border-blue-300 text-blue-600' : 'bg-white border-gray-200'}`}><Icon path={opt.i} /></button>
                                                        })}
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                ) : <div className="text-sm text-gray-400 italic">在左侧画布选择元素以编辑</div>}
                            </div>
                            <div className="flex-1 flex flex-col min-h-0 border-b border-gray-200">
                                <div className="flex items-center justify-between px-4 py-2 bg-gray-100 border-y border-gray-200"><div className="flex items-center space-x-2"><CodeIcon size={14} /><span className="text-xs font-bold text-gray-600">Code</span></div><button onClick={() => { navigator.clipboard.writeText(generatedCode); setCopied(true); setTimeout(() => setCopied(false), 2000) }} className="text-blue-600 text-xs flex items-center">{copied ? '已复制' : '复制'}</button></div>
                                <textarea className="flex-1 p-4 text-xs font-mono bg-slate-800 text-green-400 resize-none focus:outline-none" value={generatedCode} onChange={handleCodeChange} onBlur={() => { setIsManualEditing(false); setGeneratedCode(generateMermaid()) }} spellCheck="false" />
                            </div>
                            <div className={`${isFullscreen ? 'fixed inset-0 z-50 bg-white flex flex-col' : 'h-1/3 flex flex-col bg-white'}`}>
                                <div className="px-4 py-2 bg-gray-50 border-b border-gray-200 flex items-center justify-between flex-shrink-0"><span className="text-xs font-bold text-gray-600">预览</span><div className="flex items-center space-x-2 relative"><div className="relative export-menu-container"><button onClick={() => setShowExportMenu(!showExportMenu)} className="p-1 hover:bg-gray-200 rounded text-gray-600 flex items-center text-xs"><Icon path={Icons.Download} size={14} /><span>导出</span></button>{showExportMenu && (<div className="absolute right-0 top-full mt-1 w-32 bg-white border border-gray-200 shadow-xl rounded z-50 py-1"><button onClick={() => downloadExport('svg')} className="w-full text-left px-3 py-2 text-xs hover:bg-gray-50 flex items-center gap-2"><CodeIcon size={12} />SVG</button><button onClick={() => downloadExport('png')} className="w-full text-left px-3 py-2 text-xs hover:bg-gray-50 flex items-center gap-2"><ImageIconReal size={12} />PNG</button><button onClick={() => downloadExport('pdf')} className="w-full text-left px-3 py-2 text-xs hover:bg-gray-50 flex items-center gap-2"><Icon path={Icons.FileText} size={12} />PDF</button></div>)}</div><button onClick={() => setIsFullscreen(!isFullscreen)} className="p-1 hover:bg-gray-200 rounded text-gray-600"><Icon path={isFullscreen ? Icons.Minimize2 : Icons.Maximize2} size={14} /></button></div></div>
                                <div className="flex-1 relative overflow-hidden bg-white cursor-grab active:cursor-grabbing grid-bg" ref={previewContainerRef} style={{ backgroundPosition: `${previewView.x}px ${previewView.y}px`, backgroundSize: `${20 * previewView.scale}px ${20 * previewView.scale}px` }} onWheel={(e) => handleWheel(e, previewView, setPreviewView)} onPointerDown={handlePreviewPointerDown} onPointerMove={handlePreviewPointerMove}><div style={{ transform: `translate(${previewView.x}px, ${previewView.y}px) scale(${previewView.scale})`, transformOrigin: '0 0', width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><div ref={mermaidRef} className="pointer-events-none mermaid-preview"></div></div>{mermaidError && <div className="absolute bottom-2 left-2 right-2 bg-red-100 text-red-600 text-xs p-2 rounded border border-red-200">{mermaidError}</div>}<div className="absolute bottom-4 right-4 flex space-x-2 bg-white/80 backdrop-blur p-1 rounded-md shadow border border-gray-200"><div className="px-2 py-1 text-xs text-gray-500 font-mono border-r border-gray-100 flex items-center">{(previewView.scale * 100).toFixed(0)}%</div><button onClick={() => setPreviewView({ x: 0, y: 0, scale: 1 })} className="p-1 hover:bg-gray-100 rounded text-gray-600"><Icon path={Icons.Reset} size={14} /></button></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<MermaidEditor />);
    </script>
</body>

</html>
