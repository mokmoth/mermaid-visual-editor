<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid 可视化编辑器 - V8 像素级完美版</title>

    <!-- 1. 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. 核心运行时 -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- 3. JSX 编译器 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. 功能库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

    <style>
        #root:empty::before {
            content: "正在加载编辑器资源...";
            display: block;
            padding: 20px;
            text-align: center;
            color: #666;
            font-family: sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #f8fafc;
            user-select: none;
        }

        .grid-bg {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        input:focus {
            outline: none;
        }

        /* Mermaid 预览区域的文本样式 */
        .mermaid-preview .nodeLabel,
        .mermaid-preview .edgeLabel,
        .mermaid-preview .label {
            word-wrap: break-word !important;
            white-space: normal !important;
            overflow-wrap: break-word !important;
            font-size: 11px !important;
            line-height: 1.4 !important;
        }
        
        .mermaid-preview .node rect,
        .mermaid-preview .node polygon,
        .mermaid-preview .node circle,
        .mermaid-preview .node ellipse,
        .mermaid-preview .node path {
            stroke-width: 2px !important;
        }
        
        .mermaid-preview foreignObject {
            overflow: visible !important;
        }
        
        .mermaid-preview foreignObject div,
        .mermaid-preview foreignObject span,
        .mermaid-preview foreignObject p {
            word-wrap: break-word !important;
            overflow-wrap: break-word !important;
            white-space: normal !important;
            text-align: center !important;
            font-size: 11px !important;
            line-height: 1.4 !important;
            max-width: 150px !important;
            display: block !important;
        }
        
        .mermaid-preview text {
            font-size: 11px !important;
        }
        
        .mermaid-preview .cluster-label {
            font-size: 12px !important;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;
        const { createRoot } = ReactDOM;

        // --- 图标组件 ---
        const Icon = ({ path, size = 18, className = "", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );

        const Icons = {
            MousePointer2: <path d="m12 19 7-7 3 3V3H2L12 13l4-4Z"></path>,
            ArrowRight: <path d="M5 12h14M12 5l7 7-7 7"></path>,
            Trash2: <><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></>,
            Copy: <><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></>,
            Check: <path d="M20 6 9 17l-5-5"></path>,
            Maximize2: <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>,
            Minimize2: <path d="M4 14h6v-6M20 10h-6v6M14 10l7-7M3 21l7-7"></path>,
            Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path>,
            FileText: <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>,
            Reset: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>,
            Layout: <path d="M3 3h18v18H3zM21 9H3M21 15H3M12 3v18"></path>,
            Magic: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>,
            Square: <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>,
            Round: <rect x="3" y="5" width="18" height="14" rx="6" ry="6"></rect>,
            Circle: <circle cx="12" cy="12" r="10"></circle>,
            Rhombus: <path d="M12 2 2 12l10 10 10-10L12 2z"></path>,
            Stadium: <rect x="2" y="6" width="20" height="12" rx="6"></rect>,
            Subroutine: <><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="7" y1="3" x2="7" y2="21" /><line x1="17" y1="3" x2="17" y2="21" /></>,
            Database: <path d="M12 3c5 0 8 2 8 4s-3 4-8 4-8-2-8-4 3-4 8-4zm0 18c5 0 8-2 8-4V7c0 2-3 4-8 4s-8-2-8-4v10c0 2 3 4 8 4z" />,
            Hexagon: <path d="M12 2 2 7v10l10 5 10-5V7l-10-5z"></path>,
            Parallelogram: <path d="M2 18 6 6h16l-4 12H2z"></path>,
            LineSolid: <line x1="2" y1="12" x2="22" y2="12"></line>,
            LineDotted: <line x1="2" y1="12" x2="22" y2="12" strokeDasharray="4 4"></line>,
            ArrowForward: <path d="M5 12h14m-6-6l6 6-6 6"></path>,
            ArrowBack: <path d="M19 12H5m6-6l-6 6 6 6"></path>,
            ArrowBoth: <path d="M8 12h8m-4-4l4 4-4 4m-4-8l-4 4 4 4"></path>,
            ArrowNone: <line x1="5" y1="12" x2="19" y2="12"></line>,
            Save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></>,
            Folder: <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>,
            Upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></>,
            FileDown: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" x2="12" y1="18" y2="12"></line><polyline points="9 15 12 12 15 15"></polyline></>
        };

        const RotateIcon = ({ size }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>);
        const CodeIcon = ({ size }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>);
        const ImageIconReal = ({ size }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>);

        // --- 文本测量与动态尺寸 ---
        const measureText = (text, fontSize = 14) => {
            const canvas = measureText.canvas || (measureText.canvas = document.createElement("canvas"));
            const context = canvas.getContext("2d");
            context.font = `${fontSize}px sans-serif`;
            const metrics = context.measureText(text || " ");
            return { width: metrics.width, height: fontSize * 1.5 }; // 近似高度
        };

        const getNodeSize = (type, label = "", customWidth, customHeight) => {
            const minW = 60;
            const minH = 40;
            const paddingX = 30; // 左右内边距
            const paddingY = 20; // 上下内边距

            const { width: textW, height: textH } = measureText(label);

            let autoW = Math.max(minW, textW + paddingX * 2);
            let autoH = Math.max(minH, textH + paddingY);

            // 形状特定调整
            switch (type) {
                case 'circle': {
                    const d = Math.max(autoW, autoH, 60);
                    autoW = d; autoH = d;
                    break;
                }
                case 'rhombus': {
                    // 菱形内部矩形需要更大，w = internalW * 2, h = internalH * 2
                    autoW = Math.max(100, (textW + paddingX) * 2);
                    autoH = Math.max(60, (textH + paddingY) * 2);
                    break;
                }
                case 'hexagon':
                    autoW += 20; // 尖角补偿
                    break;
                case 'parallelogram':
                    autoW += 20; // 倾斜补偿
                    break;
                case 'database':
                    autoH += 10; // 顶部圆柱补偿
                    break;
            }

            // 应用自定义尺寸（如果存在），不再强制依赖自动计算的最小值，给予用户自由缩放权
            // 但保留一个绝对安全最小值防止彻底消失
            const finalW = customWidth ? Math.max(customWidth, 40) : autoW;
            const finalH = customHeight ? Math.max(customHeight, 40) : autoH;

            return { width: finalW, height: finalH };
        };

        const useUndoRedo = (initialState) => {
            const [past, setPast] = useState([]);
            const [present, setPresent] = useState(initialState);
            const [future, setFuture] = useState([]);

            const canUndo = past.length > 0;
            const canRedo = future.length > 0;

            const undo = useCallback(() => {
                if (!canUndo) return;
                const previous = past[past.length - 1];
                const newPast = past.slice(0, past.length - 1);
                setPast(newPast);
                setFuture([present, ...future]);
                setPresent(previous);
            }, [past, present, future, canUndo]);

            const redo = useCallback(() => {
                if (!canRedo) return;
                const next = future[0];
                const newFuture = future.slice(1);
                setFuture(newFuture);
                setPast([...past, present]);
                setPresent(next);
            }, [past, present, future, canRedo]);

            const set = useCallback((newPresent, clearFuture = true) => {
                if (newPresent === present) return;
                setPast(prev => [...prev, present]);
                if (clearFuture) setFuture([]);
                setPresent(newPresent);
            }, [present]);

            // 仅更新当前状态，不记录历史（用于连续操作如拖拽、缩放）
            const replace = useCallback((newPresent) => {
                setPresent(newPresent);
            }, []);

            return [present, set, undo, redo, canUndo, canRedo, replace];
        };

        const getNodeCenter = (node) => {
            const { width, height } = getNodeSize(node.type, node.label, node.customWidth, node.customHeight);
            return { x: node.x + width / 2, y: node.y + height / 2 };
        };

        // --- 几何算法：多边形与射线的交点 ---
        const intersectPolygon = (dx, dy, points) => {
            // 射线起点(0,0)，方向(dx,dy)
            let minT = Infinity;
            for (let i = 0; i < points.length; i++) {
                const p1 = points[i];
                const p2 = points[(i + 1) % points.length];

                // 线段 p1 -> p2
                // 方程: (0,0) + t*D = p1 + u*(p2 - p1)
                // t*dx = p1.x + u*(p2.x - p1.x)
                // t*dy = p1.y + u*(p2.y - p1.y)

                const det = dx * (p1.y - p2.y) - dy * (p1.x - p2.x);
                if (det === 0) continue;

                const t = ((p1.x - p2.x) * p1.y - (p1.y - p2.y) * p1.x) / det;
                const u = (dx * p1.y - dy * p1.x) / det;

                // u 在 0-1 之间表示在线段上，t > 0 表示在射线前方
                if (t > 0 && u >= 0 && u <= 1) {
                    if (t < minT) minT = t;
                }
            }
            return minT === Infinity ? 1 : minT;
        };

        // --- V8 核心升级：精确的形状边缘计算 ---
        const getBorderPoint = (node, otherPoint) => {
            const { width, height } = getNodeSize(node.type, node.label, node.customWidth, node.customHeight);
            const cx = node.x + width / 2;
            const cy = node.y + height / 2;
            const dx = otherPoint.x - cx;
            const dy = otherPoint.y - cy;

            if (dx === 0 && dy === 0) return { x: cx, y: cy };

            // 视觉校正：因为 SVG 图形有 stroke-width=2，且通常有 1px 的 padding
            // 所以我们计算交点时，形状的实际大小要比 width/height 小一点点
            // 否则交点会在 stroke 的外沿，甚至外沿之外
            const pad = 2; // 像素补偿
            const w = (width / 2) - pad;
            const h = (height / 2) - pad;

            let t = 1;

            switch (node.type) {
                case 'rhombus':
                    // 菱形方程：|x|/w + |y|/h = 1
                    // 射线：(t*dx, t*dy) 代入 -> t*(|dx|/w + |dy|/h) = 1
                    t = 1 / (Math.abs(dx) / w + Math.abs(dy) / h);
                    break;
                case 'circle':
                    // 圆方程：x^2/w^2 + y^2/h^2 = 1 (椭圆兼容)
                    t = 1 / Math.sqrt(Math.pow(dx / w, 2) + Math.pow(dy / h, 2));
                    break;
                case 'parallelogram':
                    // 平行四边形 (视觉上：左上角inset 20)
                    // 顶点相对中心坐标 (approx based on Visual Path)
                    // Visual: M20 1 L...
                    // w和h已经包含了缩放，这里我们需要定义顶点
                    // Top-Left: (-w + 20, -h), Top-Right: (w, -h)
                    // Bottom-Right: (w - 20, h), Bottom-Left: (-w, h)
                    t = intersectPolygon(dx, dy, [
                        { x: -w + 20, y: -h }, { x: w, y: -h },
                        { x: w - 20, y: h }, { x: -w, y: h }
                    ]);
                    break;
                case 'hexagon':
                    // 六边形
                    // Points: (-w+15, -h), (w-15, -h), (w, 0), (w-15, h), (-w+15, h), (-w, 0)
                    t = intersectPolygon(dx, dy, [
                        { x: -w + 15, y: -h }, { x: w - 15, y: -h }, { x: w, y: 0 },
                        { x: w - 15, y: h }, { x: -w + 15, y: h }, { x: -w, y: 0 }
                    ]);
                    break;
                case 'stadium':
                    // 体育场形（胶囊），左右是半圆，中间是矩形
                    // 简化处理：对于大多数角度，矩形逻辑或者椭圆逻辑都近似
                    // 椭圆逻辑通常比矩形更平滑，不容易断开
                    // 这里使用更精确的“矩形裁剪”作为基准，因为它主要用于流程图的水平连接
                    if (Math.abs(dx * h) > Math.abs(dy * w)) t = Math.abs(w / dx);
                    else t = Math.abs(h / dy);
                    break;
                default:
                    // 矩形 (Rect, Subroutine, Database, Round)
                    // 简单的 Box Clipping
                    // 射线与 x=w, x=-w, y=h, y=-h 的交点
                    if (Math.abs(dx * h) > Math.abs(dy * w)) {
                        t = Math.abs(w / dx);
                    } else {
                        t = Math.abs(h / dy);
                    }
                    break;
            }

            return { x: cx + dx * t, y: cy + dy * t };
        };

        const NodeVisual = ({ node, isSel, isEdit, tempLabel, setTempLabel, finishEditing, inputRef, onResizeStart, showResizeHandles = false }) => {
            const { width, height } = getNodeSize(node.type, isEdit ? tempLabel : node.label, node.customWidth, node.customHeight);

            const content = (
                <div className="absolute inset-0 z-20 flex items-center justify-center pointer-events-none p-2 overflow-hidden">
                    {isEdit ? (
                        <input
                            ref={inputRef}
                            value={tempLabel}
                            onChange={(e) => setTempLabel(e.target.value)}
                            onBlur={finishEditing}
                            onKeyDown={(e) => e.key === 'Enter' && finishEditing()}
                            className="w-full h-full bg-transparent text-center outline-none pointer-events-auto text-sm cursor-text"
                            style={{ resize: 'none' }}
                            autoFocus
                        />
                    ) : (
                        <span
                            className="text-center leading-tight w-full select-none overflow-hidden"
                            style={{
                                wordBreak: 'break-word',
                                whiteSpace: 'pre-wrap',
                                // 默认字号 12-14px，最小 6px，最大 16px
                                fontSize: `${Math.min(16, Math.max(6, Math.min(14, Math.sqrt((width * height) / (Math.max(1, node.label.length) * 4)))))}px`,
                                lineHeight: '1.3',
                                display: '-webkit-box',
                                WebkitLineClamp: Math.max(1, Math.floor(height / 12)), // 根据高度限制行数
                                WebkitBoxOrient: 'vertical',
                                textOverflow: 'ellipsis'
                            }}
                        >
                            {node.label}
                        </span>
                    )}
                </div>
            );

            const borderClass = isSel ? 'stroke-blue-500 stroke-2' : 'stroke-slate-600 stroke-2 hover:stroke-blue-400';
            const bgClass = "fill-white transition-colors duration-200";

            const renderShape = () => {
                switch (node.type) {
                    case 'rect': return <rect x="1" y="1" width={width - 2} height={height - 2} className={`${bgClass} ${borderClass}`} />;
                    case 'round': return <rect x="1" y="1" width={width - 2} height={height - 2} rx="8" className={`${bgClass} ${borderClass}`} />;
                    case 'stadium': return <rect x="1" y="1" width={width - 2} height={height - 2} rx={Math.min(width, height) / 2} className={`${bgClass} ${borderClass}`} />;
                    case 'circle': return <ellipse cx={width / 2} cy={height / 2} rx={width / 2 - 1} ry={height / 2 - 1} className={`${bgClass} ${borderClass}`} />;
                    case 'rhombus': return <path d={`M${width / 2} 1 L${width - 1} ${height / 2} L${width / 2} ${height - 1} L1 ${height / 2} Z`} className={`${bgClass} ${borderClass}`} />;
                    case 'hexagon': return <path d={`M${Math.min(15, width * 0.2)} 1 L${width - Math.min(15, width * 0.2)} 1 L${width - 1} ${height / 2} L${width - Math.min(15, width * 0.2)} ${height - 1} L${Math.min(15, width * 0.2)} ${height - 1} L1 ${height / 2} Z`} className={`${bgClass} ${borderClass}`} />;
                    case 'parallelogram': return <path d={`M${Math.min(20, width * 0.2)} 1 L${width - 1} 1 L${width - Math.min(20, width * 0.2)} ${height - 1} L1 ${height - 1} Z`} className={`${bgClass} ${borderClass}`} />;
                    case 'database': return (
                        <g>
                            <path d={`M1 10 C1 4 15 1 ${width / 2} 1 S${width - 1} 4 ${width - 1} 10 V${height - 10} C${width - 1} ${height - 4} ${width - 15} ${height - 1} ${width / 2} ${height - 1} S1 ${height - 4} 1 ${height - 10} Z`} className={`${bgClass} ${borderClass}`} />
                            <path d={`M1 10 C1 16 15 19 ${width / 2} 19 S${width - 1} 16 ${width - 1} 10`} fill="none" className={borderClass} />
                        </g>
                    );
                    case 'subroutine': return (
                        <g>
                            <rect x="1" y="1" width={width - 2} height={height - 2} className={`${bgClass} ${borderClass}`} />
                            <line x1="10" y1="1" x2="10" y2={height - 1} className={borderClass} />
                            <line x1={width - 10} y1="1" x2={width - 10} y2={height - 1} className={borderClass} />
                        </g>
                    );
                    default: return <rect x="1" y="1" width={width - 2} height={height - 2} className={`${bgClass} ${borderClass}`} />;
                }
            };

            return (
                <div className="w-full h-full relative">
                    <svg width="100%" height="100%" viewBox={`0 0 ${width} ${height}`} className="absolute inset-0 overflow-visible pointer-events-none">
                        {renderShape()}
                    </svg>
                    {content}
                    {(isSel || showResizeHandles) && (
                        <div className={`absolute inset-0 rounded ring-2 ${isSel ? 'ring-blue-100' : 'ring-gray-200'} pointer-events-none opacity-50 z-0`}>
                            {/* Resize Handles - 4 corners */}
                            <div className="absolute -left-1 -top-1 w-2.5 h-2.5 bg-blue-500 border border-white cursor-nwse-resize pointer-events-auto z-50" onPointerDown={(e) => onResizeStart(e, node, 'nw')}></div>
                            <div className="absolute -right-1 -top-1 w-2.5 h-2.5 bg-blue-500 border border-white cursor-nesw-resize pointer-events-auto z-50" onPointerDown={(e) => onResizeStart(e, node, 'ne')}></div>
                            <div className="absolute -right-1 -bottom-1 w-2.5 h-2.5 bg-blue-500 border border-white cursor-nwse-resize pointer-events-auto z-50" onPointerDown={(e) => onResizeStart(e, node, 'se')}></div>
                            <div className="absolute -left-1 -bottom-1 w-2.5 h-2.5 bg-blue-500 border border-white cursor-nesw-resize pointer-events-auto z-50" onPointerDown={(e) => onResizeStart(e, node, 'sw')}></div>
                        </div>
                    )}
                </div>
            );
        };

        const MermaidEditor = () => {
            const [graphState, setGraphState, undo, redo, canUndo, canRedo, replaceGraphState] = useUndoRedo({
                nodes: [
                    { id: 'Start', type: 'stadium', x: 100, y: 100, label: '开始' },
                    { id: 'Proc', type: 'rect', x: 100, y: 250, label: '执行过程' },
                    { id: 'Cond', type: 'rhombus', x: 100, y: 400, label: '判断循环' },
                ],
                links: [
                    { source: 'Start', target: 'Proc', id: 'link1', type: 'solid', arrow: 'forward' },
                    { source: 'Proc', target: 'Cond', id: 'link2', label: '检查', type: 'solid', arrow: 'forward' },
                    { source: 'Cond', target: 'Proc', id: 'link3', label: '不通过', type: 'dotted', arrow: 'back' },
                ]
            });
            const { nodes, links } = graphState;

            // 仅更新当前状态，不记录历史（用于连续操作如拖拽、缩放）


            // useUndoRedo returns: [present, set, undo, redo, canUndo, canRedo, replace]
            // We need to destructure the 7th item 'replace'

            // Re-destructure correctly (React hook rules must be top level, so this comment block is just thinking, actual fix is above in destructuring)

            const setNodes = useCallback((newNodesOrFn) => {
                setGraphState(prev => {
                    const newNodes = typeof newNodesOrFn === 'function' ? newNodesOrFn(prev.nodes) : newNodesOrFn;
                    return { ...prev, nodes: newNodes };
                });
            }, [setGraphState]);

            const setLinks = useCallback((newLinksOrFn) => {
                setGraphState(prev => {
                    const newLinks = typeof newLinksOrFn === 'function' ? newLinksOrFn(prev.links) : newLinksOrFn;
                    return { ...prev, links: newLinks };
                });
            }, [setGraphState]);

            // 批量更新 helper explicitly for graph operations where both change
            const setGraph = useCallback((newNodes, newLinks) => {
                setGraphState({ nodes: newNodes, links: newLinks });
            }, [setGraphState]);

            const [selection, setSelection] = useState(null);
            const [mode, setMode] = useState('select');
            const [dragState, setDragState] = useState(null);
            const [multiDragState, setMultiDragState] = useState(null); // { nodeIds: Set, initialPositions: Map, startX, startY }
            const [resizeState, setResizeState] = useState(null); // { nodeId, startX, startY, startW, startH, handle }
            const [drawingLink, setDrawingLink] = useState(null);
            const [editingNodeId, setEditingNodeId] = useState(null);
            const [editingLinkId, setEditingLinkId] = useState(null);
            const [tempLabel, setTempLabel] = useState('');

            const [editorView, setEditorView] = useState({ x: 0, y: 0, scale: 1 });
            const [previewView, setPreviewView] = useState({ x: 0, y: 0, scale: 1 });
            const [panState, setPanState] = useState(null);

            const [direction, setDirection] = useState('TD');
            const [generatedCode, setGeneratedCode] = useState('');
            const [mermaidError, setMermaidError] = useState(null);
            const [copied, setCopied] = useState(false);
            const [isManualEditing, setIsManualEditing] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [showExportMenu, setShowExportMenu] = useState(false);
            const [clipboard, setClipboard] = useState(null); // 用于复制粘贴
            const [multiSelect, setMultiSelect] = useState(new Set()); // 多选节点ID集合
            const [boxSelect, setBoxSelect] = useState(null); // 框选状态 {startX, startY, endX, endY}
            const [snapToGrid, setSnapToGrid] = useState(false); // 网格对齐
            const [hoveredNodeId, setHoveredNodeId] = useState(null); // 悬停的节点ID
            const gridSize = 20; // 网格大小

            const containerRef = useRef(null);
            const previewContainerRef = useRef(null);
            const mermaidRef = useRef(null);
            const inputRef = useRef(null);
            const rAF = useRef(null);
            const clickTracker = useRef({ id: null, time: 0 });

            useEffect(() => {
                if (window.mermaid) {
                    window.mermaid.initialize({ 
                        startOnLoad: true, 
                        theme: 'default', 
                        securityLevel: 'loose', 
                        fontFamily: 'sans-serif',
                        flowchart: {
                            htmlLabels: true,
                            useMaxWidth: false,
                            wrappingWidth: 120,
                            nodeSpacing: 30,
                            rankSpacing: 40,
                            curve: 'basis',
                            padding: 15
                        },
                        themeVariables: {
                            fontSize: '12px'
                        }
                    });
                    setNodes(prev => [...prev]);
                }
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    // 如果正在编辑文本,不处理快捷键
                    if (editingNodeId || editingLinkId) return;
                    
                    if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) redo();
                        else undo();
                    }
                    // 复制 (Cmd/Ctrl + C)
                    else if ((e.metaKey || e.ctrlKey) && e.key === 'c' && selection) {
                        e.preventDefault();
                        if (selection.type === 'node') {
                            const node = nodes.find(n => n.id === selection.id);
                            if (node) setClipboard({ type: 'node', data: { ...node } });
                        } else if (selection.type === 'link') {
                            const link = links.find(l => l.id === selection.id);
                            if (link) setClipboard({ type: 'link', data: { ...link } });
                        }
                    }
                    // 粘贴 (Cmd/Ctrl + V)
                    else if ((e.metaKey || e.ctrlKey) && e.key === 'v' && clipboard) {
                        e.preventDefault();
                        if (clipboard.type === 'node') {
                            const newNode = {
                                ...clipboard.data,
                                id: `Node${Date.now()}`,
                                x: clipboard.data.x + 50,
                                y: clipboard.data.y + 50
                            };
                            setNodes([...nodes, newNode]);
                            setSelection({ type: 'node', id: newNode.id });
                        }
                    }
                    // 删除 (Delete 或 Backspace)
                    else if ((e.key === 'Delete' || e.key === 'Backspace') && selection) {
                        e.preventDefault();
                        deleteSelection();
                    }
                    // 全选 (Cmd/Ctrl + A)
                    else if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
                        e.preventDefault();
                        const allNodeIds = new Set(nodes.map(n => n.id));
                        setMultiSelect(allNodeIds);
                        setSelection(null);
                    }
                    // ESC 取消选择
                    else if (e.key === 'Escape') {
                        setSelection(null);
                        setMultiSelect(new Set());
                        setBoxSelect(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [undo, redo, selection, clipboard, nodes, links, editingNodeId, editingLinkId]);

            useEffect(() => {
                const handleGlobalPointerUp = () => {
                    if (dragState) setDragState(null);
                    if (multiDragState) {
                        setGraphState(graphState); // Commit multi-drag to history
                        setMultiDragState(null);
                    }
                    if (resizeState) {
                        setGraphState(graphState); // Commit current state to history
                        setResizeState(null);
                    }
                    if (panState) setPanState(null);
                    // 完成框选
                    if (boxSelect) {
                        const minX = Math.min(boxSelect.startX, boxSelect.endX);
                        const maxX = Math.max(boxSelect.startX, boxSelect.endX);
                        const minY = Math.min(boxSelect.startY, boxSelect.endY);
                        const maxY = Math.max(boxSelect.startY, boxSelect.endY);
                        
                        const selectedNodes = new Set();
                        nodes.forEach(node => {
                            const { width, height } = getNodeSize(node.type, node.label, node.customWidth, node.customHeight);
                            const nodeRight = node.x + width;
                            const nodeBottom = node.y + height;
                            // 检查节点是否在框选区域内
                            if (node.x < maxX && nodeRight > minX && node.y < maxY && nodeBottom > minY) {
                                selectedNodes.add(node.id);
                            }
                        });
                        setMultiSelect(selectedNodes);
                        setBoxSelect(null);
                    }
                };
                const handleClickOutside = (e) => {
                    if (showExportMenu && !e.target.closest('.export-menu-container')) setShowExportMenu(false);
                };
                window.addEventListener('pointerup', handleGlobalPointerUp, true);
                window.addEventListener('click', handleClickOutside);
                return () => {
                    window.removeEventListener('pointerup', handleGlobalPointerUp, true);
                    window.removeEventListener('click', handleClickOutside);
                };
            }, [dragState, multiDragState, resizeState, showExportMenu, panState, graphState, setGraphState, boxSelect, nodes]);

            useEffect(() => {
                if ((editingNodeId || editingLinkId) && inputRef.current) {
                    inputRef.current.focus();
                    inputRef.current.select();
                }
            }, [editingNodeId, editingLinkId]);

            const deleteSelection = () => {
                // 多选删除
                if (multiSelect.size > 0) {
                    const nodeIdsToDelete = Array.from(multiSelect);
                    const newNodes = nodes.filter(n => !nodeIdsToDelete.includes(n.id));
                    const newLinks = links.filter(l => !nodeIdsToDelete.includes(l.source) && !nodeIdsToDelete.includes(l.target));
                    setGraph(newNodes, newLinks);
                    setMultiSelect(new Set());
                    setSelection(null);
                    return;
                }

                if (!selection) return;

                if (selection.type === 'node') {
                    const nodeId = selection.id;
                    const newNodes = nodes.filter(n => n.id !== nodeId);
                    const newLinks = links.filter(l => l.source !== nodeId && l.target !== nodeId);
                    setGraph(newNodes, newLinks);
                } else {
                    const newLinks = links.filter(l => l.id !== selection.id);
                    setLinks(newLinks);
                }

                setSelection(null);
            };

            // 将长文本按指定宽度换行
            const wrapText = (text, maxChars = 12) => {
                if (!text || text.length <= maxChars) return text;
                const words = text.split(/(\s+)/);
                let lines = [];
                let currentLine = '';
                
                for (const word of words) {
                    if ((currentLine + word).length <= maxChars) {
                        currentLine += word;
                    } else {
                        if (currentLine.trim()) lines.push(currentLine.trim());
                        // 如果单个词超过 maxChars，强制拆分
                        if (word.trim().length > maxChars) {
                            let remaining = word.trim();
                            while (remaining.length > maxChars) {
                                lines.push(remaining.substring(0, maxChars));
                                remaining = remaining.substring(maxChars);
                            }
                            currentLine = remaining;
                        } else {
                            currentLine = word;
                        }
                    }
                }
                if (currentLine.trim()) lines.push(currentLine.trim());
                return lines.join('<br/>');
            };

            const generateMermaid = useCallback(() => {
                let code = `flowchart ${direction}\n    classDef default fill:#fff,stroke:#333,stroke-width:2px;\n`;
                nodes.forEach(node => {
                    let labelText = node.label;
                    if (!labelText || labelText.trim() === '') labelText = ' ';
                    // 清理并换行长文本
                    let cleanLabel = labelText.replace(/"/g, "'");
                    const wrappedLabel = wrapText(cleanLabel, 12);
                    // 如果文本包含换行，使用双引号包裹
                    const needsQuotes = wrappedLabel.includes('<br/>');
                    const finalLabel = needsQuotes ? `"${wrappedLabel}"` : wrappedLabel;
                    
                    let shape = `[${finalLabel}]`;
                    switch (node.type) {
                        case 'rect': shape = `[${finalLabel}]`; break;
                        case 'round': shape = `(${finalLabel})`; break;
                        case 'circle': shape = `((${finalLabel}))`; break;
                        case 'rhombus': shape = `{${finalLabel}}`; break;
                        case 'stadium': shape = `([${finalLabel}])`; break;
                        case 'subroutine': shape = `[[${finalLabel}]]`; break;
                        case 'database': shape = `[(${finalLabel})]`; break;
                        case 'hexagon': shape = `{{${finalLabel}}}`; break;
                        case 'parallelogram': shape = `[/${finalLabel}/]`; break;
                        default: shape = `[${finalLabel}]`;
                    }
                    code += `    ${node.id}${shape}\n`;
                });
                links.forEach(link => {
                    const sExists = nodes.some(n => n.id === link.source);
                    const tExists = nodes.some(n => n.id === link.target);
                    if (!sExists || !tExists) return;

                    // 处理连线标签换行
                    let label = '';
                    if (link.label) {
                        const wrappedLinkLabel = wrapText(link.label.replace(/"/g, "'"), 10);
                        label = `|${wrappedLinkLabel}|`;
                    }
                    let arrow = '-->';

                    let src = link.source;
                    let tgt = link.target;

                    if (link.arrow === 'back') {
                        [src, tgt] = [tgt, src];
                        arrow = '-->';
                        if (link.type === 'dotted') arrow = '-.->';
                    }
                    else if (link.arrow === 'both') {
                        arrow = '<-->';
                        if (link.type === 'dotted') arrow = '<-.->';
                    }
                    else if (link.arrow === 'none') {
                        arrow = '---';
                        if (link.type === 'dotted') arrow = '-.-';
                    }
                    else {
                        arrow = '-->';
                        if (link.type === 'dotted') arrow = '-.->';
                    }

                    code += `    ${src} ${arrow}${label} ${tgt}\n`;
                });
                return code;
            }, [nodes, links, direction]);

            useEffect(() => {
                if (!isManualEditing && !dragState) {
                    const code = generateMermaid();
                    setGeneratedCode(code);
                    renderDiagram(code);
                }
            }, [nodes, links, direction, generateMermaid, isManualEditing, dragState]);

            const applyAutoLayout = (currentNodes, currentLinks, dir) => {
                if (!window.dagre) return currentNodes;
                const g = new dagre.graphlib.Graph();
                g.setGraph({ rankdir: dir, marginx: 50, marginy: 50 });
                g.setDefaultEdgeLabel(() => ({}));
                currentNodes.forEach(node => {
                    const { width, height } = getNodeSize(node.type, node.label, node.customWidth, node.customHeight);
                    g.setNode(node.id, { width, height });
                });
                currentLinks.forEach(link => {
                    g.setEdge(link.source, link.target);
                });
                dagre.layout(g);
                return currentNodes.map(node => {
                    const pos = g.node(node.id);
                    const { width, height } = getNodeSize(node.type, node.label, node.customWidth, node.customHeight);
                    return { ...node, x: pos.x - width / 2, y: pos.y - height / 2 };
                });
            };

            const manualLayoutTrigger = () => {
                const layoutedNodes = applyAutoLayout(nodes, links, direction);
                setNodes(layoutedNodes);
                setEditorView({ x: 0, y: 0, scale: 1 });
            };

            const toggleDirection = () => {
                const newDir = direction === 'TD' ? 'LR' : 'TD';
                setDirection(newDir);
                const layoutedNodes = applyAutoLayout(nodes, links, newDir);
                setNodes(layoutedNodes);
                setEditorView({ x: 0, y: 0, scale: 1 });
            };

            const parseMermaidCode = (code) => {
                const lines = code.split('\n');
                const nodeMap = new Map();
                const linksArr = [];
                let dir = direction;

                // Subgraph tracking
                const subgraphMap = new Map(); // SubgraphID -> [NodeID...]
                let currentSubgraph = null;

                const dirMatch = code.match(/^\s*(?:graph|flowchart)\s+(TD|LR|BT|RL)/);
                if (dirMatch) {
                    dir = dirMatch[1] === 'BT' ? 'TD' : (dirMatch[1] === 'RL' ? 'LR' : dirMatch[1]);
                }

                const parseNode = (str) => {
                    str = str.trim();
                    if (!str) return null;

                    // Strip Mermaid v10+ attribute syntax: @{ ... }
                    // We only need the ID/Label for the visual editor, attributes are for rendering
                    const attrIndex = str.indexOf('@{');
                    if (attrIndex > -1) {
                        str = str.substring(0, attrIndex).trim();
                    }

                    let id = '', type = 'rect', label = '';
                    const patterns = [
                        { type: 'stadium', re: /^([^\s\(\)]+)\s*\(\[(.*?)\]\)$/ },
                        { type: 'subroutine', re: /^([^\s\[\]]+)\s*\[\[(.*?)\]\]$/ },
                        { type: 'database', re: /^([^\s\[\]]+)\s*\[\((.*?)\)\]$/ },
                        { type: 'circle', re: /^([^\s\(\)]+)\s*\(\((.*?)\)\)$/ },
                        { type: 'hexagon', re: /^([^\s\{\}]+)\s*\{\{(.*?)\}\}$/ },
                        { type: 'parallelogram', re: /^([^\s\[\]\/]+)\s*\[\/(.*?)\/\]$/ },
                        { type: 'rhombus', re: /^([^\s\{\}]+)\s*\{(.*?)\}$/ },
                        { type: 'round', re: /^([^\s\(\)]+)\s*\((.*?)\)$/ },
                        { type: 'rect', re: /^([^\s\[\]]+)\s*\[(.*?)\]$/ },
                    ];
                    let matched = false;
                    for (let p of patterns) {
                        const m = str.match(p.re);
                        if (m) { id = m[1]; label = m[2]; type = p.type; matched = true; break; }
                    }
                    if (!matched) {
                        // Support alphanumeric IDs with underscores
                        const m = str.match(/^([a-zA-Z_][a-zA-Z0-9_]*)$/);
                        if (m) { id = m[1]; label = m[1]; } else return null;
                    }
                    return { id, type, label };
                };

                // Helper to parse multiple nodes separated by & (ignoring & inside brackets)
                const parseMultipleNodes = (str) => {
                    const parts = [];
                    let currentPart = '';
                    let bracketDepth = 0;

                    for (let i = 0; i < str.length; i++) {
                        const char = str[i];
                        if ('([{'.includes(char)) bracketDepth++;
                        else if (')]}'.includes(char)) bracketDepth--;

                        if (char === '&' && bracketDepth === 0) {
                            if (currentPart.trim()) parts.push(currentPart.trim());
                            currentPart = '';
                        } else {
                            currentPart += char;
                        }
                    }
                    if (currentPart.trim()) parts.push(currentPart.trim());

                    const nodes = [];
                    for (const part of parts) {
                        const node = parseNode(part);
                        if (node) nodes.push(node);
                    }
                    return nodes;
                };

                lines.forEach(line => {
                    line = line.trim();
                    // Skip comments, directives, class statements, etc.
                    if (!line || line.startsWith('%') || line.startsWith('classDef') || line.startsWith('class ') || line.startsWith('style') || line.startsWith('linkStyle') || line.startsWith('direction') || line.startsWith('click')) return;

                    if (line.startsWith('subgraph')) {
                        const m = line.match(/subgraph\s+([^\s\[]+)/);
                        if (m) currentSubgraph = m[1];
                        return;
                    }
                    if (line.startsWith('end')) {
                        currentSubgraph = null;
                        return;
                    }
                    if (line.startsWith('graph') || line.startsWith('flowchart')) return;

                    // Match arrows within the line
                    let linkLabel = '';
                    let leftPart = '';
                    let rightPart = '';
                    let arrowType = 'solid';
                    let hasBack = false;
                    let hasForward = false;
                    let isLink = false;

                    // Pattern 1: A -- label --> B (inline label)
                    const inlineLabelMatch = line.match(/^(.+?)\s+--\s+(.+?)\s+(-->|-.->)\s+(.+)$/);
                    if (inlineLabelMatch) {
                        leftPart = inlineLabelMatch[1].trim();
                        linkLabel = inlineLabelMatch[2].trim();
                        const arrowStr = inlineLabelMatch[3];
                        rightPart = inlineLabelMatch[4].trim();
                        arrowType = arrowStr.includes('.') ? 'dotted' : 'solid';
                        hasForward = arrowStr.endsWith('>');
                        isLink = true;
                    } else {
                        // Pattern 2: Standard arrows with optional |label|
                        // Matches: -->, ---->, -.->, -.-, ---, <-->, <-.->, etc.
                        // Updated Regex to support arbitrary length arrows
                        const arrowMatch = line.match(/(<)?(-{2,}>|<--{2,}>|<-{2,}|-{1,}\.-{0,}>|<-{1,}\.-{0,}>|<-{1,}\.-{0,}-|={2,}>|<={2,}>|-{3,}|-{1,}\.-{0,}-|\.{3,}>) ?/);

                        if (arrowMatch && arrowMatch[0].length >= 2) {
                            const arrowStr = arrowMatch[0].trim();
                            const arrowIndex = arrowMatch.index;
                            leftPart = line.substring(0, arrowIndex).trim();
                            rightPart = line.substring(arrowIndex + arrowMatch[0].length).trim();

                            // Handle label in format: A -->|label| B
                            if (rightPart.startsWith('|')) {
                                const endPipe = rightPart.indexOf('|', 1);
                                if (endPipe > -1) {
                                    linkLabel = rightPart.substring(1, endPipe);
                                    rightPart = rightPart.substring(endPipe + 1).trim();
                                }
                            }

                            arrowType = (arrowStr.includes('.') || arrowStr.includes('-.')) ? 'dotted' : 'solid';
                            hasBack = arrowStr.startsWith('<');
                            hasForward = arrowStr.endsWith('>');
                            isLink = true;
                        }
                    }

                    if (isLink) {
                        // Parse multpile nodes on both sides
                        const srcNodesRaw = parseMultipleNodes(leftPart);
                        const tgtNodesRaw = parseMultipleNodes(rightPart);

                        // Register all nodes encountered and track subgraphs
                        [...srcNodesRaw, ...tgtNodesRaw].forEach(n => {
                            if (!nodeMap.has(n.id)) nodeMap.set(n.id, n);
                            else if (n.label !== n.id) {
                                const ex = nodeMap.get(n.id); ex.type = n.type; ex.label = n.label;
                            }
                            if (currentSubgraph) {
                                if (!subgraphMap.has(currentSubgraph)) subgraphMap.set(currentSubgraph, []);
                                if (!subgraphMap.get(currentSubgraph).includes(n.id)) subgraphMap.get(currentSubgraph).push(n.id);
                            }
                        });

                        // Expand subgraphs for connections
                        let finalSrcIds = [];
                        let finalTgtIds = [];

                        srcNodesRaw.forEach(src => {
                            if (subgraphMap.has(src.id)) finalSrcIds.push(...subgraphMap.get(src.id));
                            else finalSrcIds.push(src.id);
                        });
                        tgtNodesRaw.forEach(tgt => {
                            if (subgraphMap.has(tgt.id)) finalTgtIds.push(...subgraphMap.get(tgt.id));
                            else finalTgtIds.push(tgt.id);
                        });

                        // Determine arrow logic
                        let arrow = 'forward';
                        if (hasBack && hasForward) arrow = 'both';
                        else if (hasBack) arrow = 'back';
                        else if (hasForward) arrow = 'forward';
                        else arrow = 'none';

                        // Create links
                        for (const srcId of finalSrcIds) {
                            for (const tgtId of finalTgtIds) {
                                linksArr.push({
                                    id: `link_${srcId}_${tgtId}_${Date.now()}_${Math.random()}`,
                                    source: srcId,
                                    target: tgtId,
                                    label: linkLabel,
                                    type: arrowType,
                                    arrow
                                });
                            }
                        }
                    } else {
                        // Not a link, check if it's a node definition
                        const node = parseNode(line);
                        if (node) {
                            if (!nodeMap.has(node.id)) nodeMap.set(node.id, node);
                            else if (node.label !== node.id) {
                                const ex = nodeMap.get(node.id); ex.type = node.type; ex.label = node.label;
                            }
                            if (currentSubgraph) {
                                if (!subgraphMap.has(currentSubgraph)) subgraphMap.set(currentSubgraph, []);
                                if (!subgraphMap.get(currentSubgraph).includes(node.id)) subgraphMap.get(currentSubgraph).push(node.id);
                            }
                        }
                    }
                });

                let rawNodes = Array.from(nodeMap.values()).map(n => ({ ...n, x: 0, y: 0 }));
                const isTotalReplace = rawNodes.length > 3 && !rawNodes.some(n => nodes.find(en => en.id === n.id));

                let finalNodes = rawNodes.map(n => {
                    const ex = nodes.find(en => en.id === n.id);
                    return ex ? { ...n, x: ex.x, y: ex.y } : n;
                });

                if (isTotalReplace || (nodes.length < 2 && rawNodes.length > 0)) {
                    finalNodes = applyAutoLayout(finalNodes, linksArr, dir);
                } else {
                    finalNodes = finalNodes.map(n => {
                        if (n.x === 0 && n.y === 0) {
                            return { ...n, x: 50 + Math.random() * 200, y: 50 + Math.random() * 200 };
                        }
                        return n;
                    });
                }

                if (finalNodes.length > 0) {
                    setDirection(dir);
                    setGraph(finalNodes, linksArr);
                }
            };

            const handleCodeChange = (e) => {
                const newCode = e.target.value;
                setGeneratedCode(newCode);
                setIsManualEditing(true);
                // Wrap parser in try-catch to ensure renderDiagram is always called
                try {
                    parseMermaidCode(newCode);
                } catch (err) {
                    console.error("Mermaid Parsing Error:", err);
                }
                renderDiagram(newCode);
            };

            const renderDiagram = async (code) => {
                if (!window.mermaid) return;
                try {
                    const el = mermaidRef.current;
                    if (el) {
                        el.removeAttribute('data-processed');
                        const { svg } = await window.mermaid.render(`mermaid-svg-${Date.now()}`, code);
                        el.innerHTML = svg;
                        setMermaidError(null);
                    }
                } catch (e) { setMermaidError('语法错误: ' + e.message); }
            };

            const getCanvasPos = (e, container, view) => {
                if (!container) return { x: 0, y: 0 };
                const rect = container.getBoundingClientRect();
                return { x: (e.clientX - rect.left - view.x) / view.scale, y: (e.clientY - rect.top - view.y) / view.scale };
            };

            const handleWheel = (e, view, setView) => {
                if (isManualEditing) return;
                const scaleAmount = -e.deltaY * 0.001;
                const newScale = Math.min(Math.max(0.2, view.scale + scaleAmount), 5);
                const rect = e.currentTarget.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                const worldX = (mouseX - view.x) / view.scale;
                const worldY = (mouseY - view.y) / view.scale;
                setView({ x: mouseX - worldX * newScale, y: mouseY - worldY * newScale, scale: newScale });
            };

            const handlePointerDown = (e, type, id) => {
                e.stopPropagation();
                if (editingNodeId || editingLinkId) { finishEditing(); return; }
                const clientX = e.clientX;
                const clientY = e.clientY;

                if (type === 'canvas') {
                    if (e.button === 0 || e.button === 1) {
                        // Shift + 拖拽 = 框选
                        if (e.shiftKey && mode === 'select') {
                            const pos = getCanvasPos(e, containerRef.current, editorView);
                            setBoxSelect({ startX: pos.x, startY: pos.y, endX: pos.x, endY: pos.y });
                        } else {
                            setPanState({ type: 'editor', startX: clientX, startY: clientY, viewStartX: editorView.x, viewStartY: editorView.y });
                        }
                    }
                    if (!e.shiftKey && !boxSelect) {
                        setSelection(null);
                        setMultiSelect(new Set());
                    }
                } else if (type === 'node') {
                    const node = nodes.find(n => n.id === id);
                    if (mode === 'link') {
                        const center = getNodeCenter(node);
                        const pos = getCanvasPos(e, containerRef.current, editorView);
                        setDrawingLink({ sourceId: id, startX: center.x, startY: center.y, currX: pos.x, currY: pos.y });
                        setSelection(null);
                    } else {
                        // 检查是否是多选拖拽
                        if (multiSelect.has(id)) {
                            const initialPositions = new Map();
                            multiSelect.forEach(nodeId => {
                                const n = nodes.find(nd => nd.id === nodeId);
                                if (n) initialPositions.set(nodeId, { x: n.x, y: n.y });
                            });
                            setMultiDragState({ nodeIds: new Set(multiSelect), initialPositions, startX: clientX, startY: clientY });
                        } else {
                            setSelection({ type: 'node', id });
                            setDragState({ nodeId: id, startX: clientX, startY: clientY, initialNodeX: node.x, initialNodeY: node.y });
                        }
                    }
                } else if (type === 'link') setSelection({ type: 'link', id });
            };

            const handleResizeStart = (e, node, handle) => {
                e.stopPropagation();
                e.preventDefault();
                // 获取节点的实际尺寸（优先使用自定义尺寸）
                const currentSize = getNodeSize(node.type, node.label, node.customWidth, node.customHeight);
                // 使用实际的自定义尺寸，如果没有则使用计算出的尺寸
                const startW = node.customWidth || currentSize.width;
                const startH = node.customHeight || currentSize.height;
                
                setResizeState({
                    nodeId: node.id,
                    startX: e.clientX,
                    startY: e.clientY,
                    startW: startW,
                    startH: startH,
                    startNodeX: node.x,
                    startNodeY: node.y,
                    handle
                });
            };

            const handlePointerMove = (e) => {
                if (rAF.current) return;
                const clientX = e.clientX;
                const clientY = e.clientY;

                rAF.current = requestAnimationFrame(() => {
                    if (panState) {
                        const dx = clientX - panState.startX;
                        const dy = clientY - panState.startY;
                        const setter = panState.type === 'editor' ? setEditorView : setPreviewView;
                        setter(prev => ({ ...prev, x: panState.viewStartX + dx, y: panState.viewStartY + dy }));
                    } else if (drawingLink) {
                        if (containerRef.current) {
                            const rect = containerRef.current.getBoundingClientRect();
                            const x = (clientX - rect.left - editorView.x) / editorView.scale;
                            const y = (clientY - rect.top - editorView.y) / editorView.scale;
                            setDrawingLink(prev => ({ ...prev, currX: x, currY: y }));
                        }
                    } else if (boxSelect) {
                        // 更新框选范围
                        if (containerRef.current) {
                            const rect = containerRef.current.getBoundingClientRect();
                            const x = (clientX - rect.left - editorView.x) / editorView.scale;
                            const y = (clientY - rect.top - editorView.y) / editorView.scale;
                            setBoxSelect(prev => ({ ...prev, endX: x, endY: y }));
                        }
                    } else if (resizeState) {
                        // 计算鼠标移动的距离（考虑画布缩放）
                        // 注意：这里直接使用像素差值除以缩放比例
                        const dx = (clientX - resizeState.startX) / editorView.scale;
                        const dy = (clientY - resizeState.startY) / editorView.scale;
                        const { nodeId, startW, startH, startNodeX, startNodeY, handle } = resizeState;

                        let newW = startW;
                        let newH = startH;
                        let newX = startNodeX;
                        let newY = startNodeY;

                        // 右侧调整（east）：向右拖动增加宽度
                        if (handle.includes('e')) {
                            newW = Math.max(40, startW + dx);
                        }
                        // 左侧调整（west）：向左拖动增加宽度（dx为负），向右拖动减少宽度（dx为正）
                        if (handle.includes('w')) {
                            newW = Math.max(40, startW - dx); // 注意这里是减号，因为向左拖动时dx为负
                            // 调整 X 位置，保持右边缘不变
                            newX = startNodeX + (startW - newW);
                        }
                        // 底部调整（south）：向下拖动增加高度
                        if (handle.includes('s')) {
                            newH = Math.max(40, startH + dy);
                        }
                        // 顶部调整（north）：向上拖动增加高度（dy为负），向下拖动减少高度（dy为正）
                        if (handle.includes('n')) {
                            newH = Math.max(40, startH - dy); // 注意这里是减号，因为向上拖动时dy为负
                            // 调整 Y 位置，保持底边缘不变
                            newY = startNodeY + (startH - newH);
                        }

                        const updatedNodes = nodes.map(n =>
                            n.id === nodeId ? { ...n, customWidth: newW, customHeight: newH, x: newX, y: newY } : n
                        );

                        // Use replaceGraphState for transient updates (smooth rendering, no history flood)
                        if (replaceGraphState) replaceGraphState({ ...graphState, nodes: updatedNodes });
                        else setGraphState({ ...graphState, nodes: updatedNodes });
                    } else if (dragState) {
                        const dist = Math.hypot(clientX - dragState.startX, clientY - dragState.startY);
                        if (dist > 5) {
                            const dx = (clientX - dragState.startX) / editorView.scale;
                            const dy = (clientY - dragState.startY) / editorView.scale;
                            
                            const updatedNodes = nodes.map(n =>
                                n.id === dragState.nodeId
                                    ? { 
                                        ...n, 
                                        x: snapToGrid ? Math.round((dragState.initialNodeX + dx) / gridSize) * gridSize : dragState.initialNodeX + dx,
                                        y: snapToGrid ? Math.round((dragState.initialNodeY + dy) / gridSize) * gridSize : dragState.initialNodeY + dy
                                    }
                                    : n
                            );
                            if (replaceGraphState) replaceGraphState({ ...graphState, nodes: updatedNodes });
                            else setGraphState({ ...graphState, nodes: updatedNodes });
                        }
                    } else if (multiDragState) {
                        const dx = (clientX - multiDragState.startX) / editorView.scale;
                        const dy = (clientY - multiDragState.startY) / editorView.scale;
                        const updatedNodes = nodes.map(n => {
                            if (multiDragState.nodeIds.has(n.id)) {
                                const initial = multiDragState.initialPositions.get(n.id);
                                return {
                                    ...n,
                                    x: snapToGrid ? Math.round((initial.x + dx) / gridSize) * gridSize : initial.x + dx,
                                    y: snapToGrid ? Math.round((initial.y + dy) / gridSize) * gridSize : initial.y + dy
                                };
                            }
                            return n;
                        });
                        if (replaceGraphState) replaceGraphState({ ...graphState, nodes: updatedNodes });
                        else setGraphState({ ...graphState, nodes: updatedNodes });
                    }
                    rAF.current = null;
                });
            };
            const handlePreviewPointerDown = (e) => {
                if (e.button === 0 || e.button === 1) {
                    setPanState({ type: 'preview', startX: e.clientX, startY: e.clientY, viewStartX: previewView.x, viewStartY: previewView.y });
                }
            };

            const handlePreviewPointerMove = handlePointerMove;

            const handleNodePointerUp = (e, targetId) => {
                e.stopPropagation();

                // 连线模式：完成连线
                if (mode === 'link' && drawingLink && drawingLink.sourceId !== targetId) {
                    const newLink = {
                        id: `link_${drawingLink.sourceId}_${targetId}_${Date.now()}`,
                        source: drawingLink.sourceId,
                        target: targetId,
                        type: 'solid',
                        arrow: 'forward',
                        label: ''
                    };
                    setLinks([...links, newLink]);
                    setDrawingLink(null);
                    setSelection({ type: 'link', id: newLink.id });
                    return;
                }

                // Calculate if it was a drag or a click
                const isDrag = dragState && dragState.nodeId === targetId && (Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY) > 5);

                if (dragState) setDragState(null);

                if (!isDrag && mode === 'select') {
                    const now = Date.now();
                    const last = clickTracker.current;
                    if (last.id === targetId && (now - last.time) < 300) {
                        setEditingNodeId(targetId);
                        setEditingLinkId(null);
                        setTempLabel(nodes.find(n => n.id === targetId)?.label || '');
                        clickTracker.current = { id: null, time: 0 };
                    } else {
                        clickTracker.current = { id: targetId, time: now };
                    }
                }
            };

            const handleLinkDoubleClick = (linkId, label) => {
                setEditingLinkId(linkId);
                setEditingNodeId(null);
                setTempLabel(label);
                setSelection({ type: 'link', id: linkId });
            };

            const handleCanvasPointerUp = () => { 
                if (drawingLink && mode === 'link') {
                    // 在画布上释放，取消连线
                    setDrawingLink(null);
                }
                if (dragState) setDragState(null); 
            };
            const finishEditing = () => { if (editingNodeId) { setNodes(nodes.map(n => n.id === editingNodeId ? { ...n, label: tempLabel } : n)); setEditingNodeId(null); } if (editingLinkId) { setLinks(links.map(l => l.id === editingLinkId ? { ...l, label: tempLabel } : l)); setEditingLinkId(null); } };
            const updateLabel = (v) => { if (selection?.type === 'node') setNodes(nodes.map(n => n.id === selection.id ? { ...n, label: v } : n)); if (selection?.type === 'link') setLinks(links.map(l => l.id === selection.id ? { ...l, label: v } : l)); };
            const toggleLinkType = () => { if (selection?.type === 'link') setLinks(links.map(l => l.id === selection.id ? { ...l, type: l.type === 'solid' ? 'dotted' : 'solid' } : l)); };
            const setLinkArrow = (arrowType) => { if (selection?.type === 'link') setLinks(links.map(l => l.id === selection.id ? { ...l, arrow: arrowType } : l)); };

            // --- 核心算法：计算连线几何路径 ---
            const getLinkVisuals = (link) => {
                const s = nodes.find(n => n.id === link.source);
                const t = nodes.find(n => n.id === link.target);
                if (!s || !t) return { path: '', midX: 0, midY: 0 };

                // 1. 获取中心点
                const cS = getNodeCenter(s);
                const cT = getNodeCenter(t);

                // 2. 自环特殊处理
                if (link.source === link.target) {
                    const siblings = links.filter(l => l.source === l.target && l.source === link.source);
                    const myIndex = siblings.findIndex(l => l.id === link.id);
                    const gap = 30 + (myIndex * 20);
                    return {
                        path: `M${cS.x + 10},${cS.y - 20} C${cS.x + gap},${cS.y - gap - 20} ${cS.x - gap},${cS.y - gap - 20} ${cS.x - 10},${cS.y - 20}`,
                        midX: cS.x,
                        midY: cS.y - gap - 20 + 10
                    };
                }

                // 3. 计算贝塞尔控制点 (处理多线并行)
                const siblings = links.filter(l =>
                    (l.source === link.source && l.target === link.target) ||
                    (l.source === link.target && l.target === link.source)
                );

                const dx = cT.x - cS.x;
                const dy = cT.y - cS.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist === 0) dist = 0.001;

                let controlX, controlY;

                if (siblings.length === 1) {
                    controlX = (cS.x + cT.x) / 2;
                    controlY = (cS.y + cT.y) / 2;
                } else {
                    const myIndex = siblings.findIndex(l => l.id === link.id);
                    const count = siblings.length;
                    let curvature = (myIndex - (count - 1) / 2) * 60;
                    if (link.source > link.target) curvature = -curvature;

                    const mx = (cS.x + cT.x) / 2;
                    const my = (cS.y + cT.y) / 2;
                    const nx = -dy / dist;
                    const ny = dx / dist;
                    controlX = mx + nx * curvature;
                    controlY = my + ny * curvature;
                }

                // 4. 精确边缘裁剪 (Clipping)
                // 使用 V8 的 shape-aware 裁剪算法，并传入控制点作为目标方向
                const startPoint = getBorderPoint(s, { x: controlX, y: controlY });
                const endPoint = getBorderPoint(t, { x: controlX, y: controlY });

                return {
                    path: `M${startPoint.x},${startPoint.y} Q${controlX},${controlY} ${endPoint.x},${endPoint.y}`,
                    midX: 0.25 * startPoint.x + 0.5 * controlX + 0.25 * endPoint.x,
                    midY: 0.25 * startPoint.y + 0.5 * controlY + 0.25 * endPoint.y
                };
            };

            const renderLinkInput = () => {
                if (!editingLinkId) return null;
                const link = links.find(l => l.id === editingLinkId); if (!link) return null;
                const { midX, midY } = getLinkVisuals(link);
                return (<div style={{ position: 'absolute', left: midX, top: midY, transform: 'translate(-50%, -50%)', zIndex: 20 }}><input ref={inputRef} type="text" value={tempLabel} onChange={(e) => setTempLabel(e.target.value)} onBlur={finishEditing} onKeyDown={e => e.key === 'Enter' && finishEditing()} className="text-xs text-center border border-blue-500 rounded px-1 py-0.5 shadow-sm outline-none bg-white min-w-[60px]" /></div>);
            };

            // 保存项目到本地存储
            const saveToLocalStorage = () => {
                try {
                    const data = {
                        nodes,
                        links,
                        direction,
                        version: '1.0',
                        timestamp: Date.now()
                    };
                    localStorage.setItem('mermaid-editor-data', JSON.stringify(data));
                    alert('已保存到本地存储');
                } catch (e) {
                    alert('保存失败: ' + e.message);
                }
            };

            // 从本地存储加载项目
            const loadFromLocalStorage = () => {
                try {
                    const saved = localStorage.getItem('mermaid-editor-data');
                    if (!saved) {
                        alert('没有找到保存的项目');
                        return;
                    }
                    const data = JSON.parse(saved);
                    setGraph(data.nodes || [], data.links || []);
                    if (data.direction) setDirection(data.direction);
                    alert('已加载保存的项目');
                } catch (e) {
                    alert('加载失败: ' + e.message);
                }
            };

            // 导出项目为 JSON 文件
            const exportProject = () => {
                try {
                    const data = {
                        nodes,
                        links,
                        direction,
                        mermaidCode: generateMermaid(),
                        version: '1.0',
                        timestamp: Date.now()
                    };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `mermaid-project-${Date.now()}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    alert('导出失败: ' + e.message);
                }
            };

            // 从文件导入项目
            const importProject = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.nodes && data.links) {
                                setGraph(data.nodes, data.links);
                                if (data.direction) setDirection(data.direction);
                                if (data.mermaidCode) {
                                    setGeneratedCode(data.mermaidCode);
                                    renderDiagram(data.mermaidCode);
                                }
                                alert('导入成功');
                            } else {
                                alert('文件格式不正确');
                            }
                        } catch (e) {
                            alert('导入失败: ' + e.message);
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            const downloadExport = (type) => {
                const svgEl = mermaidRef.current.querySelector('svg'); if (!svgEl) return;
                const svgData = new XMLSerializer().serializeToString(svgEl);
                if (type === 'svg') {
                    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' }); const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `diagram-${Date.now()}.svg`; a.click();
                } else {
                    const canvas = document.createElement('canvas'); const img = new Image();
                    const bbox = svgEl.viewBox.baseVal || svgEl.getBoundingClientRect(); const scale = 2;
                    canvas.width = bbox.width * scale; canvas.height = bbox.height * scale;
                    img.onload = () => {
                        const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const imgData = canvas.toDataURL('image/png');
                        if (type === 'png') { const a = document.createElement('a'); a.href = imgData; a.download = `diagram-${Date.now()}.png`; a.click(); }
                        else if (type === 'pdf') {
                            if (!window.jspdf) return alert('PDF库未加载');
                            const { jsPDF } = window.jspdf; const pdf = new jsPDF(canvas.width > canvas.height ? 'l' : 'p', 'mm', 'a4');
                            const pw = pdf.internal.pageSize.getWidth(); const ph = pdf.internal.pageSize.getHeight();
                            const ratio = Math.min(pw / canvas.width, ph / canvas.height) * 0.9;
                            pdf.addImage(imgData, 'PNG', (pw - canvas.width * ratio) / 2, (ph - canvas.height * ratio) / 2, canvas.width * ratio, canvas.height * ratio); pdf.save(`diagram-${Date.now()}.pdf`);
                        }
                    };
                    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
                }
                setShowExportMenu(false);
            };

            return (
                <div className="flex flex-col h-screen font-sans overflow-hidden text-slate-800 select-none">
                    <header className="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm z-20 relative">
                        <div className="flex items-center space-x-4 flex-1 min-w-0">
                            <div className="flex items-center space-x-1 mr-4 shrink-0"><span className="text-blue-600 font-bold text-lg">Mermaid</span><span className="text-gray-500 font-medium">Visual Editor</span></div>
                            <div className="h-6 w-px bg-gray-300 mx-2 shrink-0"></div>
                            <div className="flex flex-wrap gap-1 items-center overflow-x-auto no-scrollbar">
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'rect', x: 50 - editorView.x, y: 50 - editorView.y, label: '过程' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 tooltip shrink-0" title="过程 (Rect)"><Icon path={Icons.Square} /></button>
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'round', x: 50 - editorView.x, y: 50 - editorView.y, label: '圆角' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="圆角 (Round)"><Icon path={Icons.Round} /></button>
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'stadium', x: 50 - editorView.x, y: 50 - editorView.y, label: '开始' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="开始/结束 (Stadium)"><Icon path={Icons.Stadium} /></button>
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'subroutine', x: 50 - editorView.x, y: 50 - editorView.y, label: '子程序' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="子程序 (Subroutine)"><Icon path={Icons.Subroutine} /></button>
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'database', x: 50 - editorView.x, y: 50 - editorView.y, label: '数据' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="数据库 (Database)"><Icon path={Icons.Database} /></button>
                                <button onClick={() => { const id = `Node${Date.now()}`; setNodes([...nodes, { id, type: 'circle', x: 50 - editorView.x, y: 50 - editorView.y, label: '连接' }]); }} className="p-1.5 hover:bg-gray-100 rounded text-gray-600 shrink-0" title="圆形 (Circle)"><Icon path={Icons.Circle} /></button>
